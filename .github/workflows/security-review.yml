# Runs Claude Code's security review on every pull request targeting main.
# Findings are posted as inline PR comments.
#
# Requires repository secret: ANTHROPIC_API_KEY

name: Security Review

on:
  pull_request:
    branches:
      - main

jobs:
  security-review:
    name: Claude security review
    # Dependabot PRs run with a read-only token and do not receive repository
    # secrets, so ANTHROPIC_API_KEY is empty and the action fails. They only
    # touch dependency manifests/lockfiles, so skip the AI security review.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Claude Code security review
        uses: anthropics/claude-code-security-review@main
        with:
          claude-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          comment-pr: true
